name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Animation regression tests
        run: npm run test:anim-regression

      - name: Build
        env:
          VITE_ASSET_PATH: https://m3-org.github.io/loot-assets/
          VITE_PUBLIC_DEMO: '1'
        run: npm run build
