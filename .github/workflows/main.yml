name: CI

# RFD 0059 backfills this decision. Fowler's "Continuous Integration"
# (https://martinfowler.com/articles/continuousIntegration.html) sets
# the bar this chases: one command builds and self-tests everything,
# every commit on the mainline runs it, and a broken build is the
# loudest thing in the room. scripts/ci.sh is that one command —
# this workflow's job is to run it on GitHub's machine, not to
# duplicate its steps.
#
# The step this replaced called `npm run test:anim-regression`, a
# script package.json never defined. Every run of this job failed at
# that line. RFD 0059 records it as the reason "one step, run
# locally first" matters — a script this workflow and a developer
# both run stays honest in a way a script only CI runs does not.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.3'
          otp-version: '29.0'

      - name: Install clang
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends clang

      - name: Run scripts/ci.sh
        env:
          VITE_ASSET_PATH: https://m3-org.github.io/loot-assets/
        run: bash scripts/ci.sh
