name: Deploy weftspun-studio to Fly.io

# RFD 0062's toplevel, deployed by hand this session, now on every
# push to main instead. Uses a deploy-scoped token
# (`flyctl tokens create deploy --app weftspun-studio`), not a
# personal one, stored as the FLY_API_TOKEN repo secret.

on:
  push:
    branches:
      - main

# One deploy at a time. A push mid-deploy cancels the run already in
# flight instead of queuing a second flyctl deploy against the same
# Fly app, real, hand-cancelled more than once this session already.
concurrency:
  group: deploy-fly
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # RFD 0079: keeps the Fly secret in sync with the GitHub
      # secret of record on every deploy, not only the one this
      # session set by hand. --stage takes effect on the deploy step
      # right after, no extra rolling restart of its own.
      - run: flyctl secrets set --stage --app weftspun-studio APPSIGNAL_PUSH_API_KEY="$APPSIGNAL_PUSH_API_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPSIGNAL_PUSH_API_KEY: ${{ secrets.APPSIGNAL_PUSH_API_KEY }}
      # RFD 0076 moved fly.toml, and the Dockerfile.fly it points at
      # with a plain relative `dockerfile = "Dockerfile.fly"`, into
      # apps/weftspun_studio/. Running from inside it makes that
      # relative path, and the build context, resolve the same way
      # apps/character_taxonomy's own deploy already does.
      - run: flyctl deploy --remote-only --app weftspun-studio
        working-directory: apps/weftspun_studio
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
