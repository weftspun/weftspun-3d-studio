<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character taxonomy randomizer — RFD 0065</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 40rem;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.25rem; }
  .card {
    border: 1px solid currentColor;
    border-radius: 0.5rem;
    padding: 1rem;
    margin-top: 1rem;
  }
  dl { display: grid; grid-template-columns: 8rem 1fr; gap: 0.25rem 1rem; margin: 0; }
  dt { font-weight: 600; }
  button {
    font: inherit;
    padding: 0.5rem 1rem;
    margin-top: 1rem;
    cursor: pointer;
  }
  p.note { opacity: 0.7; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Character taxonomy randomizer</h1>
<p class="note">
  RFD 0065 derives this taxonomy from the training data, not from a
  fixed list. Every value below came from a real
  <code>resolve_trait</code> or <code>observe_numeric</code> call.
</p>
<button id="roll">Randomize</button>
<div class="card" id="card">Loading taxonomy…</div>

<script>
async function loadTaxonomy() {
  const res = await fetch('/api/v1/traits');
  if (!res.ok) throw new Error('taxonomy fetch failed: ' + res.status);
  return res.json();
}

function pickCategory(values) {
  if (!values || values.length === 0) return '(none minted yet)';
  return values[Math.floor(Math.random() * values.length)];
}

function pickNumeric(range) {
  if (!range || range.length !== 2) return '(no observations yet)';
  const [lo, hi] = range;
  if (lo === hi) return lo;
  return Math.round(lo + Math.random() * (hi - lo));
}

function render(taxonomy) {
  const card = document.getElementById('card');
  const rows = [];

  for (const [role, values] of Object.entries(taxonomy.categories || {})) {
    rows.push([role, pickCategory(values)]);
  }
  for (const [role, range] of Object.entries(taxonomy.numerics || {})) {
    rows.push([role, pickNumeric(range)]);
  }

  const dl = document.createElement('dl');
  for (const [role, value] of rows) {
    const dt = document.createElement('dt');
    dt.textContent = role;
    const dd = document.createElement('dd');
    dd.textContent = value;
    dl.append(dt, dd);
  }

  card.replaceChildren(dl);
}

let taxonomy = null;

async function roll() {
  if (!taxonomy) taxonomy = await loadTaxonomy();
  render(taxonomy);
}

document.getElementById('roll').addEventListener('click', roll);
roll().catch((err) => {
  document.getElementById('card').textContent = 'Could not load: ' + err.message;
});
</script>
</body>
</html>
