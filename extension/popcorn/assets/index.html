<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weftspun minimal test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 60rem;
        margin: 0 auto;
        padding: 1.5rem;
        background: #161616;
        color: #fcfcfc;
      }
      #status {
        opacity: 0.75;
      }
      table {
        border-collapse: collapse;
        margin-top: 1rem;
        width: 100%;
      }
      td {
        border-bottom: 1px solid #333;
        padding: 0.35rem 0.6rem;
        vertical-align: top;
      }
      td:first-child {
        width: 4rem;
        font-weight: 600;
      }
      h2 { font-size: 1rem; margin: 1.2rem 0 0.3rem; }
      .pass { color: #4ec9b0; }
      .fail { color: #f48771; }
      .dim { opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>Weftspun minimal test</h1>
    <p id="status">Loading…</p>
    <h2>Elixir VM</h2>
    <div id="vm"></div>
    <h2>WebGPU adapter</h2>
    <div id="gpu"></div>
    <h2>WGSL kernels, written by Elixir</h2>
    <div id="kernels"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
