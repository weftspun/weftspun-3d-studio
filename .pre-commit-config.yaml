# Runs with prek, which reads the pre-commit config format.
#
#   prek install
#   prek run --all-files
#
# The RECTGTN HTN domains, the model-image build sources, and every
# RFD moved to weftspun/request-for-discussion (per the user's own
# direction, consolidating the RFD tree into one shared repository).
# Their own lint hooks (mix format, elixir parses, dockerfile-and-server)
# moved there with them; nothing under this repository needs them now.
#
# thirdparty/ holds the vendored browser client and the two fabric
# subtrees (RFD 0060, RFD 0061). No hook here owns that code, so it
# stays out of every hook's file set, not only the ones whose pattern
# already misses it.
exclude: '^thirdparty/'
repos:
  - repo: local
    hooks:
      - id: studio-test
        name: mix test (weftspun_studio)
        description: >-
          Every port is a Mox mock, and the planning documents stay
          real. RFD 0054 records that split. The database tests need a
          local CockroachDB, which mix weftspun.crdb provisions.
          RFD 0076 moved the studio back into apps/weftspun_studio/,
          matching apps/character_taxonomy/'s own shape.
        entry: bash scripts/studio-test.sh
        language: system
        files: '^apps/weftspun_studio/(lib|test|config)/.*\.exs?$|^apps/weftspun_studio/mix\.exs$'
        pass_filenames: false
