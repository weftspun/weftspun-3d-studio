#
# RFD 0062's toplevel: weftspun_studio (router, planner, catalog)
# and its colocated CockroachDB, on Fly.io, reachable by the public
# internet. The model images stay on the local 4090 box, on RFD
# 0058's Quadlets, reachable by this toplevel alone, over Tailscale,
# per RFD 0062. That worker-side join is not wired up yet — see
# RFD 0062's own DETAILS.md for what still needs deciding.

app = "weftspun-studio"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.fly"

[mounts]
  source = "weftspun_studio_data"
  destination = "/data"

[[services]]
  internal_port = 4000
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
