#
# usd_viewer_app, as its own Fly.io app, apart from weftspun_studio's
# own — the same separation character_taxonomy's fly.toml already
# has. RFD 0076. weftspun_studio reaches it over Fly's private
# network at http://weftspun-usd-viewer.internal:8090 (GALLERY_URL).

app = "weftspun-usd-viewer"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8090
  protocol = "tcp"

  # Not exposed on the public internet on purpose. weftspun_studio's
  # GallerySource adapter is the only intended caller, over Fly's
  # private 6PN network. A developer reaches this app directly with
  # `fly proxy 8090` instead of a public port.
  [[services.http_checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
