#
# RFD 0065's taxonomy, as its own Fly.io app — a separate deploy
# target from weftspun_studio, the way taskweft/taskweft runs its own
# MCP server (RFD 0037). One machine, one colocated CockroachDB node
# on a Fly Volume, per RFD 0062's colocation pattern.

app = "weftspun-character-taxonomy"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "character_taxonomy_data"
  destination = "/data"

# The headless-CMS JSON route and the static randomizer page.
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"

# The MCP server RFD 0065's tools live behind.
[[services]]
  internal_port = 4001
  protocol = "tcp"

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
