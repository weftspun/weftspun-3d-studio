build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "trimesh==4.5.3"
    # RFD 0053. UsdSkel carries the skeleton and the binding.
    - "usd-core==25.5"

  run:
    - command: pget -f https://weights.invalid/skintokens/skintokens.safetensors /weights/skintokens.safetensors

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "skintokens_auto_rig"
  license: "review pending, RFD 0028"
  parameters: "0.5 B"
  bf16_weights: "1.0 GB"
  q4_k_m_weights: "0.28 GB"
  format: "bf16"
  composite: false
  internal_format: "usd"
  transmission_format: "vrm"
  rig_modes: ["skeleton", "skin", "full"]
