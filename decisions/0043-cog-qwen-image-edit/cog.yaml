# Q4_K_M only. Never add a bf16 variant: that build needs 54.0 GB,
# and RFD 0043 records why it must not exist.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "transformers==4.46.3"
    - "gguf==0.10.0"
    - "pillow==11.0.0"

  run:
    - command: pget -f https://weights.invalid/qwen/image-edit-q4_k_m.gguf /weights/edit.gguf
    - command: pget -f https://weights.invalid/qwen/vl-encoder-q4_k_m.gguf /weights/vl.gguf

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "qwen_q4_k_m_image_edit"
  license: "Apache-2.0"
  parameters: "27.0 B"
  bf16_weights: "54.0 GB"
  q4_k_m_weights: "14.85 GB"
  format: "q4_k_m"
  composite: false
  saving_against_bf16: "39.15 GB"
