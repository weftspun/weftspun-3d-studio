# Pixal3D. The primary image to 3D Cog. RFD 0040 records the design.
#
# The weights are measured, and not guessed: 24.045 GB across seven
# safetensors files in TencentARC/Pixal3D. Every file is fp16 or bf16,
# thus 2 bytes per parameter and about 12.02 B parameters.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0
    - libgomp1
    - git

  python_packages:
    # Pinned to the upstream requirements.txt at the commit this Cog
    # targets. An unpinned wheel changes the mesh.
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "pillow==12.0.0"
    - "imageio==2.37.2"
    - "imageio-ffmpeg==0.6.0"
    - "tqdm==4.67.1"
    - "easydict==1.13"
    - "opencv-python-headless==4.12.0.88"
    - "trimesh==4.10.1"
    - "transformers==4.57.3"
    - "zstandard==0.25.0"
    - "kornia==0.8.2"
    - "timm==1.0.22"
    - "diffusers==0.37.1"
    - "accelerate==1.13.0"
    - "plyfile==1.1.3"
    # RFD 0053. OpenUSD is the internal format.
    - "usd-core==25.5"

  run:
    # MoGe has no wheel. Upstream installs it from git.
    - pip install git+https://github.com/microsoft/MoGe.git

    # NATTEN needs a CUDA architecture at build time. Pick the one the
    # target GPU uses, because a mismatch fails at import and not here.
    - pip install natten==0.21.0

    # Upstream itself. Pin the commit: master moves, and a moved
    # master changes the mesh with no build change to show for it.
    - git clone https://github.com/TencentARC/Pixal3D.git /src/Pixal3D

    # Three model repositories download at build time. A cold start
    # that downloads 24 GB is a cold start that times out.
    - >-
      python -c "from huggingface_hub import snapshot_download;
      snapshot_download('TencentARC/Pixal3D', local_dir='/weights/pixal3d')"
    - >-
      python -c "from huggingface_hub import snapshot_download;
      snapshot_download('Ruicheng/moge-2-vitl', local_dir='/weights/moge')"
    - >-
      python -c "from huggingface_hub import snapshot_download;
      snapshot_download('camenduru/dinov3-vitl16-pretrain-lvd1689m',
      local_dir='/weights/dinov3')"

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "pixal3d_image_to_textured_mesh"
  upstream: "https://github.com/TencentARC/Pixal3D"
  license: "MIT"
  parameters: "12.02 B, measured from the checkpoint sizes"
  bf16_weights: "24.045 GB, measured"
  format: "bf16 and fp16, mixed, both 2 bytes per parameter"
  composite: false
  primary_for: "image_to_textured_mesh"
  internal_format: "usd"
  transmission_format: "glb"
  # Each stage runs and then frees, thus the peak is one DiT plus a
  # decoder. --low_vram makes that explicit.
  peak_resident_gb_low_vram: 6.5
  peak_resident_gb_default: 24.045
  backbone: "TRELLIS.2, per the upstream README"
  checkpoints:
    - "ss_flow_img_dit_1_3B_64_bf16.safetensors, 5.360 GB"
    - "slat_flow_img2shape_dit_1_3B_512_bf16.safetensors, 5.547 GB"
    - "slat_flow_img2shape_dit_1_3B_1024_bf16.safetensors, 5.547 GB"
    - "slat_flow_imgshape2tex_dit_1_3B_1024_bf16.safetensors, 5.547 GB"
    - "shape_dec_next_dc_f16c32_fp16.safetensors, 0.948 GB"
    - "tex_dec_next_dc_f16c32_fp16.safetensors, 0.948 GB"
    - "ss_dec_conv3d_16l8_fp16.safetensors, 0.148 GB"
