build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "plyfile==1.1"
    - "pillow==11.0.0"
    # RFD 0053. The stage places the splat. It does not describe the
    # Gaussians, because no settled USD schema exists for them.
    - "usd-core==25.5"

  run:
    - command: pget -f https://weights.invalid/worldmirror2/worldmirror2.safetensors /weights/worldmirror2.safetensors

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "worldmirror2_reconstruct"
  license: "review pending, RFD 0028"
  parameters: "1.2 B"
  bf16_weights: "2.4 GB"
  q4_k_m_weights: "0.66 GB"
  format: "bf16"
  composite: false
  internal_format: "usd"
  transmission_format: "ply"
  min_photos: 2
  solves_poses: true
