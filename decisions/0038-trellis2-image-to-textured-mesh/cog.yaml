build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "trimesh==4.5.3"
    # RFD 0053. OpenUSD is the internal format.
    - "usd-core==25.5"
    - "pillow==11.0.0"

  run:
    # Pin by digest. A tag moves, and a moved tag changes the mesh
    # with no build change to show for it.
    - command: pget -f https://weights.invalid/trellis2/sparse_structure.safetensors /weights/sparse_structure.safetensors
    - command: pget -f https://weights.invalid/trellis2/slat_flow.safetensors /weights/slat_flow.safetensors
    - command: pget -f https://weights.invalid/trellis2/dinov2_vitl14.safetensors /weights/dinov2_vitl14.safetensors

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "trellis2_image_to_textured_mesh"
  license: "MIT"
  parameters: "4.0 B"
  bf16_weights: "8.0 GB"
  q4_k_m_weights: "2.20 GB"
  format: "bf16"
  composite: false
  base_for:
    - "trellis2_image_mesh_painting"
    - "voxhammer_text_mesh_editing"
    - "voxhammer_image_mesh_editing"
    - "weftspun_image_to_world"
  internal_format: "usd"
  transmission_format: "glb"
