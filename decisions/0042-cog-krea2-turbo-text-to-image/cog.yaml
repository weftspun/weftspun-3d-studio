build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "transformers==4.46.3"
    - "pillow==11.0.0"

  run:
    # Q4_K_M, per RFD 0027. Never copy the whole pretrained folder:
    # it is 57 GB, and most of that is fp32 copies this Cog never
    # reads. RFD 0042 records that trap.
    - command: pget -f https://weights.invalid/krea2/backbone-q4_k_m.gguf /weights/backbone.gguf
    - command: pget -f https://weights.invalid/krea2/t5-q4_k_m.gguf /weights/t5.gguf
    - command: pget -f https://weights.invalid/krea2/clip-q4_k_m.gguf /weights/clip.gguf
    - command: pget -f https://weights.invalid/krea2/vae-q4_k_m.gguf /weights/vae.gguf

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "krea2_turbo_text_to_image"
  license: "review pending, RFD 0028"
  parameters: "16.9 B"
  bf16_weights: "33.8 GB"
  q4_k_m_weights: "9.30 GB"
  format: "q4_k_m"
  composite: false
  staged_load: true
