build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "plyfile==1.1"
    - "pillow==11.0.0"
    # RFD 0053. The stage places the splat.
    - "usd-core==25.5"

  run:
    - command: pget -f https://weights.invalid/triposplat/triposplat.safetensors /weights/triposplat.safetensors

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "triposplat_image_to_splat"
  license: "review pending, RFD 0028"
  parameters: "1.1 B"
  bf16_weights: "2.2 GB"
  q4_k_m_weights: "0.61 GB"
  format: "bf16"
  composite: false
  internal_format: "usd"
  transmission_format: "ply"
  max_photos: 1
  # decisions/agent/DECISIONS.md, 2026-07-26. The flip happens here,
  # and the output is already flipped. LingBot must never take it.
  applies_x_flip: true
  mounted_by: "weftspun_image_to_world, RFD 0049"
