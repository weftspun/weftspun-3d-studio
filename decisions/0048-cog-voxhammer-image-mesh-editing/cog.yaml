# Derives from RFD 0038. It adds no weights, and it shares the RFD
# 0047 domain.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "trimesh==4.5.3"
    - "pillow==11.0.0"
    # RFD 0053. The edit is a sublayer over the source mesh.
    - "usd-core==25.5"

  run: []

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "voxhammer_image_mesh_editing"
  license: "MIT"
  parameters: "0"
  bf16_weights: "0 GB, shares RFD 0038"
  format: "bf16"
  composite: true
  components: 2
  base_image: "weftspun/trellis2-base"
  domain: "../0047-cog-voxhammer-text-mesh-editing/domain.ex"
  problem: "problem.ex"
  internal_format: "usd"
  transmission_format: "glb"
