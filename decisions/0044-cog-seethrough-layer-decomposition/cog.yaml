# Nine networks, one Cog. The order lives in domain.ex, and not
# in predict.py. RFD 0044 records why.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "transformers==4.46.3"
    - "pillow==11.0.0"
    - "pytoshop==1.2.1"

  run:
    - command: pget -f https://weights.invalid/seethrough/layerdiff-unet.safetensors /weights/layerdiff-unet.safetensors
    - command: pget -f https://weights.invalid/seethrough/marigold-unet.safetensors /weights/marigold-unet.safetensors
    - command: pget -f https://weights.invalid/seethrough/layerdiff-te2.safetensors /weights/layerdiff-te2.safetensors
    - command: pget -f https://weights.invalid/seethrough/marigold-te.safetensors /weights/marigold-te.safetensors
    - command: pget -f https://weights.invalid/seethrough/layerdiff-te1.safetensors /weights/layerdiff-te1.safetensors
    - command: pget -f https://weights.invalid/seethrough/trans-vae.safetensors /weights/trans-vae.safetensors
    - command: pget -f https://weights.invalid/seethrough/layerdiff-vae.safetensors /weights/layerdiff-vae.safetensors
    - command: pget -f https://weights.invalid/seethrough/marigold-vae.safetensors /weights/marigold-vae.safetensors
    - command: pget -f https://weights.invalid/seethrough/big-lama.safetensors /weights/big-lama.safetensors

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "seethrough_layer_decomposition"
  license: "Apache-2.0"
  parameters: "4.9 B"
  bf16_weights: "9.82 GB"
  q4_k_m_weights: "2.70 GB"
  format: "bf16"
  composite: true
  components: 9
  domain: "domain.ex"
  problem: "problem.ex"
