# Template. Copy this into each model folder, and change the marked
# lines. RFD 0036 records the rules this file follows.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    # Pin every version. An unpinned wheel changes the output.
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"

  # Weights download at build time, and not at predict time. A cold
  # start that downloads weights is a cold start that can fail.
  run:
    - command: pget -f https://example.invalid/weights.safetensors /weights/model.safetensors
      mounts:
        - type: cache
          target: /weights

predict: "predict.py:Predictor"

# Not read by Cog. Read by a human, and by RFD 0026.
x-weftspun:
  model_id: "example_model_id"
  license: "MIT"
  parameters: "0.0 B"
  bf16_weights: "0.0 GB"
  q4_k_m_weights: "0.0 GB"
  composite: false
