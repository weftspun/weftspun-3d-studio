# A composite over two other Cogs. It owns no weights, and it mounts
# the two weight sets from the images RFD 0038 and RFD 0052 publish.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "trimesh==4.5.3"
    - "plyfile==1.1"
    # RFD 0053. The world is a USD stage, and not one flat file.
    - "usd-core==25.5"

  run: []

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "weftspun_image_to_world"
  license: "MIT"
  parameters: "0"
  bf16_weights: "10.2 GB across both halves"
  peak_resident: "8.0 GB, because the domain unloads between stages"
  format: "bf16"
  composite: true
  components: 2
  domain: "domain.ex"
  problem: "problem.ex"
  internal_format: "usd"
  transmission_format: "glb + ply"
  parts:
    - "triposplat_image_to_splat, RFD 0052"
    - "trellis2_image_to_textured_mesh, RFD 0038"
