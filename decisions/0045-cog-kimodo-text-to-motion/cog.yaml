build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "transformers==4.46.3"

  run:
    - command: pget -f https://weights.invalid/kimodo/kimodo.safetensors /weights/kimodo.safetensors

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "kimodo_text_to_motion"
  license: "review pending, RFD 0028"
  parameters: "0.3 B"
  bf16_weights: "0.6 GB"
  q4_k_m_weights: "0.17 GB"
  format: "bf16"
  composite: false
  emits: "soma"
  retarget_target: "vrm humanoid"
