# Derives from RFD 0038. It adds no weights, thus the layer is small.
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"

  system_packages:
    - libgl1
    - libglib2.0-0

  python_packages:
    - "torch==2.5.1"
    - "numpy==2.1.3"
    - "safetensors==0.4.5"
    - "trimesh==4.5.3"
    # RFD 0053. OpenUSD is the internal format.
    - "usd-core==25.5"
    - "pillow==11.0.0"

  # No weight download. The base image already carries /weights.
  run: []

predict: "predict.py:Predictor"

x-weftspun:
  model_id: "trellis2_image_mesh_painting"
  license: "MIT"
  parameters: "0"
  bf16_weights: "0 GB, shares RFD 0038"
  format: "bf16"
  composite: false
  base_image: "weftspun/trellis2-base"
  requires_uv: true
  internal_format: "usd"
  transmission_format: "glb"
